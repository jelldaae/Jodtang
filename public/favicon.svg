<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Soft, realistic drop shadows -->
    <filter id="book_drop_shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="8" dy="32" stdDeviation="30" flood-color="#021E12" flood-opacity="0.38" />
    </filter>

    <filter id="char_soft_shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="-4" dy="18" stdDeviation="16" flood-color="#053320" flood-opacity="0.45" />
    </filter>

    <filter id="coin_drop_shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-10" dy="24" stdDeviation="22" flood-color="#032014" flood-opacity="0.48" />
    </filter>

    <filter id="ring_shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="8" dy="14" stdDeviation="10" flood-color="#053521" flood-opacity="0.35" />
    </filter>

    <filter id="emboss_subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#C27803" flood-opacity="0.4" />
    </filter>

    <!-- Gradients -->
    <!-- Book Front Cover -->
    <linearGradient id="book_face_grad" x1="220" y1="180" x2="800" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24D396" />
      <stop offset="25%" stop-color="#1DBB83" />
      <stop offset="65%" stop-color="#149566" />
      <stop offset="100%" stop-color="#0E7851" />
    </linearGradient>

    <!-- Book 3D Extrusion Side/Bottom -->
    <linearGradient id="book_side_grad" x1="160" y1="200" x2="840" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#127852" />
      <stop offset="40%" stop-color="#0B5C3D" />
      <stop offset="100%" stop-color="#073E29" />
    </linearGradient>

    <!-- Ring White Capsule Gradient -->
    <linearGradient id="ring_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E8EFEB" />
      <stop offset="100%" stop-color="#CBD8D0" />
    </linearGradient>

    <!-- 3D Puffy Letter จ Face -->
    <linearGradient id="char_face_grad" x1="360" y1="260" x2="720" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FAF5EE" />
      <stop offset="100%" stop-color="#ECE5D9" />
    </linearGradient>

    <!-- 3D Puffy Letter จ Extrusion Depth -->
    <linearGradient id="char_depth_grad" x1="360" y1="260" x2="720" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9D2C5" />
      <stop offset="50%" stop-color="#B8B0A2" />
      <stop offset="100%" stop-color="#8E8576" />
    </linearGradient>

    <!-- Golden Coin Gradients -->
    <linearGradient id="coin_rim_grad" x1="620" y1="560" x2="940" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="20%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#FFCA28" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <radialGradient id="coin_center_grad" cx="42%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#FFEE58" />
      <stop offset="35%" stop-color="#FFD54F" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>

    <linearGradient id="coin_side_depth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Daisy Flower Emboss Gradient -->
    <linearGradient id="flower_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="40%" stop-color="#FFE082" />
      <stop offset="85%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Top-Right Golden Sprouts -->
    <linearGradient id="sprout1_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEE58" />
      <stop offset="50%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="sprout2_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- 1. Top Right Golden Sprout Leaves with Teardrop Slits -->
  <g id="sprout_leaves">
    <!-- Sprout 1 (Top-Left leaf of pair) -->
    <g transform="translate(805, 175) rotate(42)">
      <!-- Golden Body -->
      <ellipse cx="0" cy="0" rx="35" ry="76" fill="url(#sprout1_grad)" />
      <!-- Dark Teal Inner Slit / Teardrop -->
      <path d="M 0 -38 C 14 -12 14 16 0 38 C -14 16 -14 -12 0 -38 Z" fill="#0C4E36" />
    </g>

    <!-- Sprout 2 (Bottom-Right leaf of pair) -->
    <g transform="translate(885, 235) rotate(66)">
      <!-- Golden Body -->
      <ellipse cx="0" cy="0" rx="30" ry="68" fill="url(#sprout2_grad)" />
      <!-- Dark Teal Inner Slit / Teardrop -->
      <path d="M 0 -34 C 12 -10 12 14 0 34 C -12 14 -12 -10 0 -34 Z" fill="#0C4E36" />
    </g>
  </g>

  <!-- 2. Notebook 3D Side & Bottom Extrusion with Drop Shadow -->
  <!-- Angled slightly in 3D perspective -->
  <path
    d="M 210 190 
       C 210 135 255 105 320 105 
       L 760 105 
       C 825 105 870 145 875 210 
       L 885 730 
       C 885 800 835 860 765 875 
       L 290 920 
       C 230 930 185 885 185 825 
       L 175 250 
       Z"
    fill="url(#book_side_grad)"
    filter="url(#book_drop_shadow)"
  />

  <!-- 3. Notebook Front Surface (Rounded Squircle Cover) -->
  <g id="notebook_cover_front">
    <path
      d="M 215 140 
         C 215 125 240 108 285 108 
         L 750 108 
         C 810 108 855 145 858 205 
         L 865 710 
         C 865 770 820 815 760 825 
         L 280 860 
         C 225 868 190 825 190 770 
         L 190 200 
         C 190 160 200 140 215 140 Z"
      fill="url(#book_face_grad)"
    />

    <!-- Subtle Bevel Sheen on Top-Left Edge -->
    <path
      d="M 235 140 
         L 740 120 
         C 785 120 825 145 838 185 
         C 825 160 780 138 735 138 
         L 280 138 
         C 240 138 215 160 208 195 
         C 212 165 225 145 235 140 Z"
      fill="#FFFFFF"
      opacity="0.3"
    />
  </g>

  <!-- 4. Spiral White Marshmallow Rings on Left Edge (4 Rings) -->
  <g id="spiral_white_rings">
    <!-- Ring 1 -->
    <g transform="translate(60, 360)">
      <rect x="0" y="-30" width="180" height="68" rx="34" fill="url(#ring_grad)" filter="url(#ring_shadow)" />
      <!-- Specular Highlight Sheen on Top -->
      <rect x="18" y="-22" width="144" height="20" rx="10" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Ring 2 -->
    <g transform="translate(85, 490)">
      <rect x="0" y="-30" width="180" height="68" rx="34" fill="url(#ring_grad)" filter="url(#ring_shadow)" />
      <rect x="18" y="-22" width="144" height="20" rx="10" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Ring 3 -->
    <g transform="translate(110, 620)">
      <rect x="0" y="-30" width="180" height="68" rx="34" fill="url(#ring_grad)" filter="url(#ring_shadow)" />
      <rect x="18" y="-22" width="144" height="20" rx="10" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Ring 4 -->
    <g transform="translate(130, 745)">
      <rect x="0" y="-30" width="180" height="68" rx="34" fill="url(#ring_grad)" filter="url(#ring_shadow)" />
      <rect x="18" y="-22" width="144" height="20" rx="10" fill="#FFFFFF" opacity="0.8" />
    </g>
  </g>

  <!-- 5. Bold 3D Puffy Cream-White Thai Letter "จ" with Cutout Inner Window -->
  <g id="thai_letter_jor" filter="url(#char_soft_shadow)">
    <!-- 3D Extrusion Side Layer (Darker Depth) -->
    <path
      d="M 345 570 
         C 345 520 380 475 435 475 
         C 465 475 490 490 515 520 
         C 525 500 528 440 520 390 
         C 505 320 445 285 365 310 
         C 310 328 275 390 280 445 
         C 285 490 320 505 350 490 
         C 370 480 375 450 365 430 
         C 355 410 330 405 325 385 
         C 320 365 340 345 375 345 
         C 420 345 455 370 465 420 
         C 475 470 455 530 435 565 
         C 415 600 425 640 455 675 
         C 490 715 540 735 580 735 
         C 630 735 680 705 715 645 
         C 755 575 770 475 750 385 
         C 730 295 660 250 560 250 
         C 460 250 370 290 310 355 
         C 260 410 240 480 250 550 
         C 260 620 310 670 380 675 
         L 395 675 
         C 365 650 345 615 345 570 Z"
      fill="url(#char_depth_grad)"
      transform="translate(-6, 20)"
    />

    <!-- Front Face of Puffy Letter "จ" -->
    <!-- Outer perimeter & Inner Cutout Loop matching the uploaded 3D icon -->
    <path
      fill-rule="evenodd"
      d="
        /* Outer Contour of Letter จ */
        M 565 245 
        C 670 245 745 295 765 390 
        C 785 480 770 585 725 660 
        C 685 725 630 755 575 755 
        C 525 755 470 730 435 685 
        C 400 645 385 600 395 550 
        C 405 500 445 475 490 475 
        C 515 475 535 490 545 515 
        C 555 540 545 575 525 595 
        C 510 610 500 625 505 645 
        C 510 665 530 675 555 675 
        C 585 675 620 655 645 615 
        C 680 555 695 475 685 410 
        C 675 350 635 315 565 315 
        C 495 315 435 350 385 405 
        C 350 445 330 495 340 555 
        C 345 595 330 625 300 630 
        C 270 635 245 610 240 570 
        C 230 485 255 405 310 340 
        C 375 265 470 245 565 245 Z

        /* Inner Cutout Hole between Top Arch and Body */
        M 560 380 
        C 595 380 615 405 620 445 
        C 625 490 615 545 595 585 
        C 580 615 560 625 545 625 
        C 530 625 520 615 520 595 
        C 520 575 530 555 540 535 
        C 550 515 550 490 540 470 
        C 530 450 515 440 495 440 
        C 475 440 460 455 455 475 
        C 450 455 455 435 470 415 
        C 490 390 525 380 560 380 Z
      "
      fill="url(#char_face_grad)"
    />

    <!-- Specular Highlight Rim along the Top Arch of "จ" -->
    <path
      d="M 390 385 
         C 435 335 500 300 570 300 
         C 640 300 680 335 690 390 
         C 680 345 640 315 570 315 
         C 500 315 440 350 395 400 Z"
      fill="#FFFFFF"
      opacity="0.85"
    />
  </g>

  <!-- 6. Foreground 3D Golden Coin in Bottom Right Corner -->
  <g id="foreground_golden_coin" filter="url(#coin_drop_shadow)">
    <!-- 3D Coin Extrusion Rim (Side/Bottom) -->
    <circle cx="780" cy="740" r="175" fill="url(#coin_side_depth)" />

    <!-- Coin Outer Raised Beveled Rim -->
    <circle cx="770" cy="720" r="172" fill="url(#coin_rim_grad)" />
    <!-- Bright Edge Ring -->
    <circle cx="770" cy="720" r="166" fill="none" stroke="#FFFDE7" stroke-width="5" opacity="0.9" />

    <!-- Recessed Coin Face -->
    <circle cx="770" cy="720" r="140" fill="url(#coin_center_grad)" />
    <!-- Inner Groove Shadow Line -->
    <circle cx="770" cy="720" r="140" fill="none" stroke="#B45309" stroke-width="6" opacity="0.45" />

    <!-- 6-Petal Embossed Flower / Daisy Motif in Center of Coin -->
    <g id="coin_flower_daisy" transform="translate(770, 720)" filter="url(#emboss_subtle)">
      <!-- Petal 1 (Top) -->
      <circle cx="0" cy="-48" r="26" fill="url(#flower_grad)" />
      <!-- Petal 2 (Top-Right) -->
      <circle cx="42" cy="-24" r="26" fill="url(#flower_grad)" />
      <!-- Petal 3 (Bottom-Right) -->
      <circle cx="42" cy="24" r="26" fill="url(#flower_grad)" />
      <!-- Petal 4 (Bottom) -->
      <circle cx="0" cy="48" r="26" fill="url(#flower_grad)" />
      <!-- Petal 5 (Bottom-Left) -->
      <circle cx="-42" cy="24" r="26" fill="url(#flower_grad)" />
      <!-- Petal 6 (Top-Left) -->
      <circle cx="-42" cy="-24" r="26" fill="url(#flower_grad)" />

      <!-- Center Hub of Flower -->
      <circle cx="0" cy="0" r="32" fill="url(#flower_grad)" />
      <!-- Specular Highlight on Flower Center -->
      <circle cx="-5" cy="-6" r="10" fill="#FFFDE7" opacity="0.75" />
    </g>

    <!-- Top-Left Coin Specular Glare Arc -->
    <path
      d="M 650 635 
         C 685 585 755 560 825 565 
         C 775 565 710 585 675 625 
         C 660 645 648 668 644 690 
         C 642 668 645 645 650 635 Z"
      fill="#FFFFFF"
      opacity="0.65"
    />
  </g>
</svg>